name: Bug or false positive
description: A crash, wrong result, or a finding that should not be there
labels: [bug]
body:
  - type: input
    attributes:
      label: unshit version and command
      placeholder: "0.4.1 — npx unshit scan ."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal code that reproduces it
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected vs actual result
    validations:
      required: true
