name: Release

# Triggered only by a version tag. Create tags with `pnpm release` (see RELEASING.md).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Prepare npm for OIDC Trusted Publishing
        run: |
          # No npm token is used: publishing authenticates through OIDC and needs
          # a Trusted Publisher for this workflow on npmjs.com (without one,
          # npm publish fails with E404). setup-node still exports a placeholder
          # NODE_AUTH_TOKEN, so unset it before running npm against the registry.
          unset NODE_AUTH_TOKEN
          npm install -g npm@^11.5.1
          node -e "const [major,minor,patch]=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)"
          npm --version

      - name: Verify tag, version, branch and changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not on main"; exit 1
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pkg

      - name: Publish to npm (skipped if this version is already published)
        run: |
          unset NODE_AUTH_TOKEN
          name="$(node -p "require('./package.json').name")"
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm, skipping"
          else
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            npm publish --provenance --access public --tag "$tag"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            flags=()
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
